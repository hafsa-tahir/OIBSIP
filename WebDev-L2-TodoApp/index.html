<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskLedger — Advanced To-Do Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1117;
    --surface: #161B22;
    --surface-hover: #1F242C;
    --border: #30363D;
    --text: #F0F6FC;
    --text-muted: #8B949E;
    --accent: #238636;
    --accent-hover: #2EA043;
    --danger: #DA3633;
    --warning: #D29922;
    --info: #1F6FEB;
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  .app-title {
    font-size: 1.5rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .app-title span {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    color: var(--text-muted);
  }

  /* Task Form */
  .task-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  @media(min-width: 640px) {
    .task-form { grid-template-columns: 2fr 1fr 1fr auto; }
  }

  input, select, button {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.65rem 0.8rem;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--info);
  }

  .btn {
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }

  /* Controls & Filters */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    justify-content: space-between;
    align-items: center;
  }

  .filter-group, .search-group {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .search-group input {
    min-width: 220px;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .filter-btn.active {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--text-muted);
  }

  /* Task List */
  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    min-height: 150px;
  }

  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    cursor: grab;
    transition: transform 0.15s ease, background 0.2s;
  }
  .task-item:active { cursor: grabbing; }
  .task-item.dragging {
    opacity: 0.4;
    border: 2px dashed var(--info);
  }

  .task-left {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    flex: 1;
    word-break: break-word;
  }

  .task-checkbox {
    width: 18px;
    height: 18px;
    margin-top: 3px;
    cursor: pointer;
  }

  .task-content {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .task-title {
    font-size: 1rem;
    font-weight: 500;
  }
  .completed .task-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-family: var(--font-mono);
  }

  .tag {
    background: rgba(31, 111, 235, 0.15);
    color: #58a6ff;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
  }

  .priority {
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    font-weight: 600;
  }
  .priority-high { background: rgba(218, 54, 51, 0.2); color: #f85149; }
  .priority-medium { background: rgba(210, 153, 34, 0.2); color: #e3b341; }
  .priority-low { background: rgba(35, 134, 54, 0.2); color: #3fb950; }

  .due-date {
    color: var(--text-muted);
  }
  .due-date.overdue {
    color: var(--danger);
    font-weight: 600;
  }

  .task-actions {
    display: flex;
    gap: 0.5rem;
  }

  .action-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.3rem;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }
  .action-btn:hover { color: var(--text); background: var(--surface-hover); }
  .action-btn.delete:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    font-style: italic;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="app-title">TaskLedger <span>OIBSIP // L2</span></div>
    <div id="taskStats" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">0 completed</div>
  </header>

  <!-- Add Task Form -->
  <form class="task-form" id="taskForm">
    <input type="text" id="taskInput" placeholder="What needs to be done?" required autocomplete="off">
    <select id="categoryInput">
      <option value="Work">Work</option>
      <option value="Personal">Personal</option>
      <option value="Study">Study</option>
      <option value="Finance">Finance</option>
    </select>
    <select id="priorityInput">
      <option value="Medium">Medium Priority</option>
      <option value="High">High Priority</option>
      <option value="Low">Low Priority</option>
    </select>
    <div style="display: flex; gap: 0.5rem;">
      <input type="date" id="dateInput" style="flex: 1;" required>
      <button type="submit" class="btn" style="padding: 0.65rem 1rem;">Add</button>
    </div>
  </form>

  <!-- Search & Filters -->
  <div class="controls">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="Search tasks or tags...">
    </div>
  </div>

  <!-- Task List Container -->
  <ul class="task-list" id="taskList">
    <!-- Rendered dynamically -->
  </ul>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  let tasks = JSON.parse(localStorage.getItem('oibsip_todos')) || [
    { id: '1', title: 'Complete OIBSIP Web Dev Task', category: 'Work', priority: 'High', dueDate: '2026-06-30', completed: false },
    { id: '2', title: 'Record Demo Video walkthrough', category: 'Work', priority: 'Medium', dueDate: '2026-06-25', completed: true }
  ];

  let currentFilter = 'all';
  let searchQuery = '';

  const taskForm = document.getElementById('taskForm');
  const taskInput = document.getElementById('taskInput');
  const categoryInput = document.getElementById('categoryInput');
  const priorityInput = document.getElementById('priorityInput');
  const dateInput = document.getElementById('dateInput');
  const taskList = document.getElementById('taskList');
  const searchInput = document.getElementById('searchInput');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const taskStats = document.getElementById('taskStats');

  // Set default date to today
  dateInput.value = new Date().toISOString().split('T')[0];

  function saveAndRender() {
    localStorage.setItem('oibsip_todos', JSON.stringify(tasks));
    renderTasks();
  }

  function renderTasks() {
    taskList.innerHTML = '';

    const todayStr = new Date().toISOString().split('T')[0];

    const filtered = tasks.filter(task => {
      const matchesFilter = 
        currentFilter === 'active' ? !task.completed :
        currentFilter === 'completed' ? task.completed : true;

      const matchesSearch = 
        task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        task.category.toLowerCase().includes(searchQuery.toLowerCase());

      return matchesFilter && matchesSearch;
    });

    // Update stats
    const completedCount = tasks.filter(t => t.completed).length;
    taskStats.textContent = `${completedCount}/${tasks.length} completed`;

    if (filtered.length === 0) {
      taskList.innerHTML = `<div class="empty-state">No tasks found. Create one above or change filters.</div>`;
      return;
    }

    filtered.forEach((task, index) => {
      const isOverdue = task.dueDate && task.dueDate < todayStr && !task.completed;

      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      li.setAttribute('draggable', 'true');
      li.dataset.id = task.id;

      li.innerHTML = `
        <div class="task-left">
          <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
          <div class="task-content">
            <span class="task-title">${escapeHTML(task.title)}</span>
            <div class="task-meta">
              <span class="tag">${task.category}</span>
              <span class="priority priority-${task.priority.toLowerCase()}">${task.priority}</span>
              <span class="due-date ${isOverdue ? 'overdue' : ''}">
                ${isOverdue ? '⚠️ Overdue: ' : 'Due: '}${task.dueDate}
              </span>
            </div>
          </div>
        </div>
        <div class="task-actions">
          <button class="action-btn edit" title="Edit Task">✏️</button>
          <button class="action-btn delete" title="Delete Task">🗑️</button>
        </div>
      `;

      // Event Listeners for Item Actions
      const checkbox = li.querySelector('.task-checkbox');
      checkbox.addEventListener('change', () => {
        task.completed = checkbox.checked;
        saveAndRender();
      });

      const deleteBtn = li.querySelector('.delete');
      deleteBtn.addEventListener('click', () => {
        tasks = tasks.filter(t => t.id !== task.id);
        saveAndRender();
      });

      const editBtn = li.querySelector('.edit');
      editBtn.addEventListener('click', () => {
        const newTitle = prompt('Edit task title:', task.title);
        if (newTitle !== null && newTitle.trim() !== '') {
          task.title = newTitle.trim();
          saveAndRender();
        }
      });

      // Native Drag and Drop Listeners
      li.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', task.id);
        setTimeout(() => li.classList.add('dragging'), 0);
      });

      li.addEventListener('dragend', () => {
        li.classList.remove('dragging');
      });

      taskList.appendChild(li);
    });
  }

  // Native Drag Over and Drop handling on taskList
  taskList.addEventListener('dragover', (e) => {
    e.preventDefault();
    const draggingItem = document.querySelector('.dragging');
    const siblings = [...taskList.querySelectorAll('.task-item:not(.dragging)')];
    
    let nextSibling = siblings.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = e.clientY - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;

    if (nextSibling) {
      taskList.insertBefore(draggingItem, nextSibling);
    } else {
      taskList.appendChild(draggingItem);
    }
  });

  taskList.addEventListener('drop', (e) => {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const newOrderIds = [...taskList.querySelectorAll('.task-item')].map(item => item.dataset.id);
    
    tasks.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
    saveAndRender();
  });

  // Form Submit (Add Task)
  taskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = taskInput.value.trim();
    if (!title) return;

    const newTask = {
      id: Date.now().toString(),
      title,
      category: categoryInput.value,
      priority: priorityInput.value,
      dueDate: dateInput.value,
      completed: false
    };

    tasks.unshift(newTask);
    taskInput.value = '';
    dateInput.value = new Date().toISOString().split('T')[0];
    saveAndRender();
  });

  // Filter Buttons
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  // Search Input
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderTasks();
  });

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  renderTasks();
});
</script>
</body>
</html>
